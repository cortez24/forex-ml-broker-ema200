<!DOCTYPE html>
<html>
<head>
<title>AI Trading Lab</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:40px}
button{padding:10px;margin:5px}
.card{background:#1e293b;padding:20px;margin-top:20px;border-radius:10px}
</style>
</head>
<body>

<h1>🚀 AI Trading Lab</h1>

<input id="pair" placeholder="EURUSD">

<button onclick="download()">Download Data</button>
<button onclick="backtest()">Backtest</button>
<button onclick="train()">Train ML</button>
<button onclick="predict()">ML Predict</button>

<div class="card">
<pre id="output"></pre>
</div>

<script>
function getPair(){
    return document.getElementById("pair").value;
}

function download(){
fetch("/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pair:getPair()})})
.then(r=>r.json()).then(d=>document.getElementById("output").innerText=JSON.stringify(d,null,2))
}

function backtest(){
fetch("/backtest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pair:getPair()})})
.then(r=>r.json()).then(d=>document.getElementById("output").innerText=JSON.stringify(d,null,2))
}

function train(){
fetch("/train",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pair:getPair()})})
.then(r=>r.json()).then(d=>document.getElementById("output").innerText=JSON.stringify(d,null,2))
}

function predict(){
fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pair:getPair()})})
.then(r=>r.json()).then(d=>document.getElementById("output").innerText=JSON.stringify(d,null,2))
}
</script>

</body>
</html>
